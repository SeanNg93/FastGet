name: Release

# Push a tag like v1.2.0 to build, test and publish the installer and portable zip as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (builds artifacts only, no release)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: ./build-release.ps1 -Version ${{ steps.v.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: FastGet-${{ steps.v.outputs.version }}
          path: |
            publish/*.exe
            publish/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem publish -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @files --title "FastGet ${{ steps.v.outputs.version }}" --generate-notes
